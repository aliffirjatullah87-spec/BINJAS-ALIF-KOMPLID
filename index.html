function home(){let s=iso(new Date());if(s<'2026-09-01')s='2026-09-01';if(s>'2026-11-30')s='2026-11-30';let total=Object.values(db.checks).filter(Boolean).length;let days=Math.max(0,Math.ceil((parse('2026-11-30')-new Date())/86400000));return heroDay(s)+card('<div class="row"><div><div class="eyebrow">COUNTDOWN</div><div class="big">'+days+' hari</div></div><span class="badge">🎯 30 NOV 2026</span></div><div class="bar" style="margin-top:12px"><i style="width:'+Math.min(100,total/91*100)+'%"></i></div><small class="muted">Checklist global: '+total+' selesai</small>')+card('<h3>⚡ Patokan latihan</h3><div class="grid"><div class="metric"><b>10–15 mnt</b><small>Pemanasan tempo/interval</small></div><div class="metric"><b>5–10 mnt</b><small>Cooldown</small></div><div class="metric"><b>1,5–2 mnt</b><small>Antar set strength biasa</small></div><div class="metric"><b>2–4 mnt</b><small>Antar sesi 1 menit</small></div></div>')}
function calendar(){let m=parse(current).getMonth(),y=parse(current).getFullYear(),first=new Date(y,m,1),last=new Date(y,m+1,0),cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div></div>');for(let d=1;d<=last.getDate();d++){let s=iso(new Date(y,m,d)),p=dayData(s),done=checked(s+'-day'),rest=p.run.startsWith('REST');cells.push('<div class="day '+(rest?'rest ':'')+(s===current?'sel ':'')+(done?'done':'')+'" data-date="'+s+'"><div class="dayNum">'+d+'</div><div class="dayType">'+(rest?'REST':p.time+'<br>'+p.run.split(' @')[0])+'</div>'+(done?'<div class="dayCheck">✓ selesai</div>':'')+'</div>')}return card('<div class="row"><div><div class="eyebrow">PROGRAM RESMI</div><h2>'+parse(current).toLocaleDateString('id-ID',{month:'long',year:'numeric'})+'</h2></div><div class="selectRow"><button data-month="8" class="'+(m===8?'on':'')+'">Sep</button><button data-month="9" class="'+(m===9?'on':'')+'">Okt</button><button data-month="10" class="'+(m===10?'on':'')+'">Nov</button></div></div><div class="calendar">'+dow.map(x=>'<div class="dow">'+x+'</div>').join('')+cells.join('')+'</div>')+heroDay(current)}
function week(){let d=parse(current),monday=new Date(d);let delta=(monday.getDay()+6)%7;monday.setDate(monday.getDate()-delta);let a=[];for(let i=0;i<7;i++){let x=new Date(monday);x.setDate(monday.getDate()+i);let s=iso(x),p=dayData(s),st=strength[s],rest=p.run.startsWith('REST');a.push('<div class="card '+(s===current?'today':'')+'"><div class="row"><div><b>'+x.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'})+'</b><small class="muted">'+s+'</small></div><span class="badge '+(rest?'pillRest':'pillRun')+'">'+(rest?'REST':p.time)+'</span></div><p style="margin-bottom:6px">'+(rest?'😴 '+p.run:'🏃 '+p.run)+'</p>'+(st&&st.type!=='—'?'<div class="note"><b>💪 '+st.type+'</b><br>'+st.text+'</div>':'')+(rest?'':task(s+'-day','Selesai hari ini',checked(s+'-day'))+'</div>')}return '<div class="eyebrow">7 HARI</div><h2>Minggu yang dipilih</h2>'+a.join('')}
function progress(){let totalRuns=db.runs.length,totalFit=db.fits.length,lastRun=db.runs[totalRuns-1],lastFit=db.fits[totalFit-1];return card('<h2>📈 Progress</h2><div class="grid4"><div class="metric"><small>Catatan lari</small><b>'+totalRuns+'</b></div><div class="metric"><small>Tes fisik</small><b>'+totalFit+'</b></div><div class="metric"><small>Hari belajar</small><b>'+new Set(db.study.map(x=>x.date)).size+'</b></div><div class="metric"><small>Jam belajar</small><b>'+db.study.reduce((a,x)=>a+Number(x.hours||0),0).toFixed(1)+'</b></div></div>')+card('<h3>🏃 Catat hasil lari</h3><div class="grid"><input id="rd" type="number" step="0.01" placeholder="Jarak km"><input id="rt" type="number" step="0.01" placeholder="Waktu menit"></div><br><button class="primary" id="saveRun">Simpan lari</button>'+(lastRun?'<p class="muted">Terakhir: '+lastRun.distance+' km • '+lastRun.minutes+' menit • pace '+lastRun.pace+' min/km</p>':'')) +card('<h3>💪 Catat tes 1 menit</h3><div class="grid4"><input id="fp" type="number" placeholder="Pull-up"><input id="fu" type="number" placeholder="Push-up"><input id="fs" type="number" placeholder="Sit-up"><input id="fw" type="number" step="0.1" placeholder="BB kg"></div><br><button class="primary" id="saveFit">Simpan hasil</button>'+(lastFit?'<p class="muted">Terakhir: Pull '+lastFit.pull+' • Push '+lastFit.push+' • Sit '+lastFit.sit+'</p>':''))}
function study(){let h=db.study.reduce((a,x)=>a+Number(x.hours||0),0);return card('<div class="row"><div><div class="eyebrow">19.00–20.30</div><h2>📚 Study Log</h2></div><span class="badge">'+new Set(db.study.map(x=>x.date)).size+' hari</span></div><div class="grid"><input id="sub" placeholder="Mata pelajaran"><input id="mat" placeholder="Materi"><input id="hrs" type="number" step="0.1" placeholder="Durasi jam (1.5)"><textarea id="sum" rows="3" placeholder="Kesimpulan: apa yang gua pahami?"></textarea></div><br><textarea id="weak" rows="3" placeholder="Materi yang belum dikuasai"></textarea><br><br><button class="primary" id="saveStudy">💾 Simpan catatan</button><p class="muted">Total belajar: '+h.toFixed(1)+' jam</p>')+card('<h3>📝 Rekap materi</h3>'+(db.study.length?db.study.slice().reverse().map(x=>'<div class="task"><span><b>'+x.subject+' • '+x.material+'</b><small>'+x.date+' • '+x.hours+' jam<br>Kesimpulan: '+x.summary+'<br><span class="danger">Belum dikuasai: '+(x.weak||'-')+'</span></small></span></div>').join(''):'<p class="muted">Belum ada catatan. Isi setelah sesi belajar.</p>'))}
function prayer(){let s=iso(new Date()),p=db.prayers[s]||{};return card('<div class="eyebrow">BEKASI</div><h2>🕌 Sholat 5 Waktu</h2>'+['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(n=>task('p-'+n,n,p[n])).join('')+'<p class="muted">Checklist pribadi. Waktu sholat mengikuti jadwal setempat.</p>')}
function rules(){return card('<h2>⚡ Rules</h2><div class="note"><b>ANTAR REPETISI</b><br>Nggak perlu istirahat; repetisi berurutan dengan teknik dan ritme rapi.</div><div class="note" style="margin-top:9px"><b>STRENGTH BIASA</b><br>1,5–2 menit antar set. Kalau set berat dan napas belum pulih, boleh 2–3 menit.</div><div class="note" style="margin-top:9px"><b>LATIHAN 1 MENIT</b><br>Istirahat 2–4 menit antar set.</div><div class="note" style="margin-top:9px"><b>TEMPO / INTERVAL</b><br>Pemanasan 10–15 menit. Cooldown 5–10 menit. Tempo seperti 3×1 km: recovery 2–3 menit jalan/jogging ringan.</div><div class="note" style="margin-top:9px"><b>SUBMAKSIMAL</b><br>Berhenti saat masih punya kira-kira 2 repetisi cadangan. Jangan failure.</div><div class="note" style="margin-top:9px"><b>30 NOV</b><br>TES 12 menit + Pull-up 21 + Push-up 45 + Sit-up 45. Antar tes 5–10 menit.</div><p class="danger">Kalau muncul nyeri tajam, hentikan latihan.</p>')}
function render(v){current=current||iso(new Date());document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view===v));V.innerHTML=v==='home'?home():v==='calendar'?calendar():v==='week'?week():v==='progress'?progress():v==='study'?study():v==='prayer'?prayer():rules()}
T.addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)render(b.dataset.view);let mb=e.target.closest('[data-month]');if(mb){let d=parse(current);d.setMonth(Number(mb.dataset.month),1);current=iso(d);render('calendar')}});V.addEventListener('click',e=>{let day=e.target.closest('.day');if(day){current=day.dataset.date;render('calendar')}if(e.target.id==='saveRun'){let d=+document.getElementById('rd').value,t=+document.getElementById('rt').value;if(d&&t){db.runs.push({date:iso(new Date()),distance:d,minutes:t,pace:(t/d).toFixed(2)});save();render('progress')}}if(e.target.id==='saveFit'){db.fits.push({date:iso(new Date()),pull:+document.getElementById('fp').value||0,push:+document.getElementById('fu').value||0,sit:+document.getElementById('fs').value||0});save();render('progress')}if(e.target.id==='saveStudy'){let subject=document.getElementById('sub').value.trim(),material=document.getElementById('mat').value.trim(),summary=document.getElementById('sum').value.trim();if(subject&&material&&summary){db.study.push({date:iso(new Date()),subject,material,summary,weak:document.getElementById('weak').value,hours:+document.getElementById('hrs').value||0});save();render('study')}}});V.addEventListener('change',e=>{if(e.target.dataset.id){db.checks[e.target.dataset.id]=e.target.checked;save();render(document.querySelector('.tabs .on').dataset.view)}if(e.target.dataset.id&&e.target.dataset.id.startsWith('p-')){let s=iso(new Date()),p=db.prayers[s]||{};p[e.target.dataset.id.slice(2)]=e.target.checked;db.prayers[s]=p;save()}});document.getElementById('weightBtn').onclick=()=>{let w=prompt('Berat badan sekarang (kg):',db.weight);if(w){db.weight=w;save()}};save();render('home');})();</script><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}</script></body></html>
