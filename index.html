<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><link rel="manifest" href="manifest.json"><title>BINJAS ALIF</title><style>body{margin:0;background:#0f1115;color:#f5f5f5;font-family:Arial,sans-serif}.wrap{max-width:850px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tabs button{white-space:nowrap}.card{background:#191c23;border:1px solid #2b303b;border-radius:15px;padding:16px;margin:12px 0}button{border:0;border-radius:10px;padding:10px 13px;background:#2a303b;color:white;font-weight:700;cursor:pointer}.active{outline:2px solid white}.primary{background:#eee;color:#111}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{font-size:25px;font-weight:800}.muted{color:#aeb4bf;font-size:13px}.task{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #2b303b}.task input{width:20px;height:20px}input,textarea,select{width:100%;padding:10px;background:#111318;color:white;border:1px solid #343a46;border-radius:9px;box-sizing:border-box}small{display:block;color:#aeb4bf;margin-top:4px}@media(max-width:600px){.grid{grid-template-columns:1fr}}.hide{display:none}.ok{color:#9ee493}</style></head><body><div class="wrap"><div class="top"><div><h1>🔥 BINJAS ALIF</h1><div class="muted">Program 3 bulan • Lari + Fisik + Belajar + Sholat</div></div><button id="settingsBtn">⚙️</button></div><div class="tabs" id="tabs"><button data-tab="home" class="active">🏠 Dashboard</button><button data-tab="week">📅 Mingguan</button><button data-tab="progress">📈 Progress</button><button data-tab="study">📚 Belajar</button><button data-tab="prayer">🕌 Sholat</button><button data-tab="rules">📌 Aturan</button></div><main id="app"></main></div><script>
(function(){
'use strict';
var app=document.getElementById('app'),tabs=document.getElementById('tabs'),checks=JSON.parse(localStorage.getItem('checks')||'{}'),prayer=JSON.parse(localStorage.getItem('prayer')||'{}'),logs=JSON.parse(localStorage.getItem('studyLogs')||'[]'),runs=JSON.parse(localStorage.getItem('runLogs')||'[]'),fits=JSON.parse(localStorage.getItem('fitLogs')||'[]'),weight=localStorage.getItem('weight')||'69';
function save(){localStorage.setItem('checks',JSON.stringify(checks));localStorage.setItem('prayer',JSON.stringify(prayer));localStorage.setItem('studyLogs',JSON.stringify(logs));localStorage.setItem('runLogs',JSON.stringify(runs));localStorage.setItem('fitLogs',JSON.stringify(fits));localStorage.setItem('weight',weight)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function month(){return ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][new Date().getMonth()]}
var runPlan={Sep:['Easy 5 km @ 5:50–6:30','6×400 m @ 4:20–4:40','Easy 4 km @ 5:50–6:30','Long 7 km @ 6:00–6:30','Recovery 4 km @ 6:20–6:50','Tempo 3×1 km @ 5:10–5:30','Easy 5 km @ 5:50–6:30'],Oct:['6×400 m @ 4:00–4:20','Long 9 km @ 5:50–6:20','Easy 5 km @ 5:45–6:20','Tempo 3×1 km @ 4:45–5:00','5×800 m @ 4:00–4:20','Long 10 km @ 5:50–6:20','Recovery 4 km @ 6:15–6:45'],Nov:['Easy 5 km @ 5:45–6:20','5×600 m @ 3:45–4:00','Tempo 3×1 km @ 4:10–4:30','Long 9 km @ 5:50–6:20','8×400 m @ 3:45–4:00','Recovery 4 km @ 6:15–6:45','TES 12 menit — target 3,2 km @ 3:45/km']};
var strengthPlan={Sep:'Pull-up 4×5–7 • Push-up 4×12–15 • Sit-up 4×15–20',Oct:'Pull-up 4×6–8 • Push-up 4×18–22 • Sit-up 4×22–27',Nov:'Pull-up 4×7–10 • Push-up 4×20–25 • Sit-up 4×20–25'};
function card(x){return '<div class="card">'+x+'</div>'}
function task(id,text){return '<label class="task"><input type="checkbox" data-check="'+id+'" '+(checks[id]?'checked':'')+'><span>'+text+'</span></label>'}
function home(){var k=today(),m=month(),done=Object.keys(checks).filter(function(x){return x.indexOf(k)==0&&checks[x]}).length;var r=runPlan[m];var rtext=r?r[new Date().getDay()]||r[0]:'Mulai program September';return card('<h2>📅 Hari Ini</h2><p>'+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'</p>'+task(k+'-run','🏃 '+rtext)+task(k+'-fit','💪 '+(strengthPlan[m]||'Strength sesuai fase program'))+task(k+'-study','📚 Belajar 19.00–20.30')+task(k+'-summary','📝 Tulis kesimpulan setelah belajar')+'<p class="muted">Checklist selesai hari ini: '+done+'</p>')+card('<h3>🎯 Target Tes Akhir</h3><div class="grid"><div><b>Pull-up</b><div class="stat">21 / 1 menit</div></div><div><b>Push-up</b><div class="stat">45 / 1 menit</div></div><div><b>Sit-up</b><div class="stat">45 / 1 menit</div></div><div><b>Lari</b><div class="stat">3,2 km / 12 menit</div></div></div>')+card('<h3>⚖️ Berat</h3><div class="stat">'+weight+' kg</div><p class="muted">Catat perubahan tanpa mengejar penurunan berat badan secara ekstrem.</p>')}
function week(){var m=month(),r=runPlan[m]||[];var html='<h2>📅 Jadwal Mingguan</h2>';r.forEach(function(x,i){html+=task('week-'+m+'-'+i,['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'][i]+': '+x)});html+='<p class="muted">💡 Satu hari libur penuh per minggu. Antar set strength istirahat 60–120 detik. Kalau bolos, lanjut jadwal berikutnya—jangan menggandakan volume.</p>';return card(html)}
function progress(){var h=logs.reduce(function(a,x){return a+Number(x.hours||0)},0);return card('<h2>📈 Progress 3 Bulan</h2><div class="grid"><div><div class="muted">TOTAL HARI BELAJAR</div><div class="stat">'+new Set(logs.map(function(x){return x.date})).size+'</div></div><div><div class="muted">TOTAL JAM BELAJAR</div><div class="stat">'+h.toFixed(1)+'</div></div><div><div class="muted">CATATAN LARI</div><div class="stat">'+runs.length+'</div></div><div><div class="muted">TES FISIK</div><div class="stat">'+fits.length+'</div></div></div>')+card('<h3>🏃 Catat Lari</h3><input id="rd" type="number" step="0.01" placeholder="Jarak km"><br><br><input id="rt" type="number" step="0.01" placeholder="Waktu menit"><br><br><button class="primary" id="saveRun">Simpan Lari</button>')+card('<h3>💪 Catat Tes 1 Menit</h3><div class="grid"><input id="fp" type="number" placeholder="Pull-up"><input id="fu" type="number" placeholder="Push-up"></div><br><input id="fs" type="number" placeholder="Sit-up"><br><br><button class="primary" id="saveFit">Simpan Tes</button>')}
function study(){var h=logs.reduce(function(a,x){return a+Number(x.hours||0)},0),out=card('<h2>📚 Belajar 19.00–20.30</h2><p>Total hari: <b>'+new Set(logs.map(function(x){return x.date})).size+'</b> • Total jam: <b>'+h.toFixed(1)+'</b></p><input id="sub" placeholder="Mata pelajaran"><br><br><input id="mat" placeholder="Materi"><br><br><textarea id="sum" rows="4" placeholder="Kesimpulan materi setelah belajar"></textarea><br><br><textarea id="weak" rows="3" placeholder="Materi yang belum dikuasai"></textarea><br><br><input id="hrs" type="number" step="0.1" placeholder="Durasi jam, contoh 1.5"><br><br><button class="primary" id="saveStudy">Simpan Catatan</button>');if(logs.length){out+=card('<h3>📝 Rekap</h3>'+logs.slice().reverse().map(function(x){return '<div class="task"><span><b>'+x.subject+' — '+x.material+'</b><small>'+x.date+' • '+x.hours+' jam<br>Kesimpulan: '+x.summary+'<br>Belum dikuasai: '+(x.weak||'-')+'</small></span></div>'}).join(''))}return out}
function prayers(){var k=today(),p=prayer[k]||{};return card('<h2>🕌 Sholat 5 Waktu</h2>'+['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(function(n){return '<label class="task"><input type="checkbox" data-prayer="'+n+'" '+(p[n]?'checked':'')+'><span>'+n+'</span></label>'}).join('')+'<p class="muted">Waktu mengikuti jadwal sholat setempat di Bekasi.</p>')}
function rules(){return card('<h2>📌 Aturan Konsistensi</h2><p>• Mood jelek: lakukan versi minimum, jangan nol total.</p><p>• Antar set: istirahat 60–120 detik.</p><p>• Kalau bolos: lanjut jadwal berikutnya, jangan balas dengan latihan dua kali lipat.</p><p>• Libur penuh: 1 hari per minggu.</p><p>• Belajar: 19.00–20.30, lalu tulis kesimpulan + materi yang belum dikuasai.</p>')}
function render(name){try{app.innerHTML=name==='home'?home():name==='week'?week():name==='progress'?progress():name==='study'?study():name==='prayer'?prayers():rules()}catch(e){app.innerHTML=card('<h2>⚠️ Error aplikasi</h2><p>'+String(e)+'</p><button onclick="location.reload()">Reload</button>');console.error(e)}}
tabs.addEventListener('click',function(e){var b=e.target.closest('button[data-tab]');if(!b)return;document.querySelectorAll('.tabs button').forEach(function(x){x.classList.remove('active')});b.classList.add('active');render(b.dataset.tab)});
app.addEventListener('change',function(e){if(e.target.dataset.check){checks[e.target.dataset.check]=e.target.checked;save();}if(e.target.dataset.prayer){var k=today(),p=prayer[k]||{};p[e.target.dataset.prayer]=e.target.checked;prayer[k]=p;save();}});
app.addEventListener('click',function(e){if(e.target.id==='saveStudy'){logs.push({date:today(),subject:document.getElementById('sub').value,material:document.getElementById('mat').value,summary:document.getElementById('sum').value,weak:document.getElementById('weak').value,hours:document.getElementById('hrs').value});save();render('study')}if(e.target.id==='saveRun'){var d=Number(document.getElementById('rd').value),t=Number(document.getElementById('rt').value);if(d&&t){runs.push({date:today(),distance:d,minutes:t,pace:(t/d).toFixed(2)});save();render('progress')}}if(e.target.id==='saveFit'){fits.push({date:today(),pull:document.getElementById('fp').value,push:document.getElementById('fu').value,sit:document.getElementById('fs').value});save();render('progress')}});
document.getElementById('settingsBtn').addEventListener('click',function(){var w=prompt('Berat badan sekarang (kg):',weight);if(w){weight=w;save();render('home')}});
render('home');
})();
</script><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(function(){})}</script></body></html>
