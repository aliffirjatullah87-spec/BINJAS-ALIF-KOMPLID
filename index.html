<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BINJAS ALIF</title><style>body{margin:0;padding:12px;background:#0b1018;color:#fff;font:16px system-ui}main{max-width:700px;margin:auto}.hero,.card{background:#141c29;border:1px solid #2d3a50;border-radius:16px;padding:15px;margin:10px 0}.tabs{display:flex;gap:6px;overflow:auto;position:sticky;top:0;background:#0b1018;padding:8px 0;z-index:3}button{border:1px solid #344158;background:#1b2636;color:#fff;border-radius:10px;padding:10px;font-weight:700}.on,.primary{background:#8bff6a;color:#071008}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric{background:#ffffff09;padding:10px;border-radius:11px}.task{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff12}.task input{width:21px;height:21px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:60px;background:#101722;border:1px solid #2d3a50;border-radius:8px;padding:5px;font-size:10px;cursor:pointer}.sel{border-color:#8bff6a}.done{background:#17321d}.muted{color:#9ca8bb}input,textarea{width:100%;box-sizing:border-box;margin:4px 0;padding:10px;border-radius:9px;border:1px solid #344158;background:#0b1018;color:#fff}</style><main><section class="hero"><b>BINJAS ALIF 🔥</b><h1>Build. Run. Repeat.</h1><p class="muted">September–November 2026</p><div class="grid"><div class="metric"><b>3,2 km</b><br>12 menit</div><div class="metric"><b>21</b><br>Pull-up</div><div class="metric"><b>45</b><br>Push-up</div><div class="metric"><b>45</b><br>Sit-up</div></div></section><nav class="tabs" id="tabs"><button data-v="home" class="on">🏠 Home</button><button data-v="cal">🗓️ Jadwal</button><button data-v="week">📅 Mingguan</button><button data-v="study">📚 Belajar</button><button data-v="fit">📈 Progress</button><button data-v="pray">🕌 Sholat</button></nav><div id="view"></div></main><script>
const dates={};for(let d=1;d<=30;d++)dates['2026-09-'+String(d).padStart(2,'0')]=1;for(let d=1;d<=31;d++)dates['2026-10-'+String(d).padStart(2,'0')]=1;for(let d=1;d<=30;d++)dates['2026-11-'+String(d).padStart(2,'0')]=1;const plans={};Object.keys(dates).forEach(k=>{let d=new Date(k+'T12:00:00'),w=d.getDay();plans[k]=[d.toLocaleDateString('id-ID',{weekday:'long'}),w===1||w===5?'REST':w===2?'TEMPO / INTERVAL':w===3?'EASY':w===4?'INTERVAL':w===6?'LONG':'RECOVERY',w===1||w===5?'—':'05.30']});plans['2026-09-01']=['Selasa','Easy 5 km @ 5:50–6:30','05.30'];plans['2026-09-02']=['Rabu','6×400 m @ 4:20–4:40','05.15'];plans['2026-09-03']=['Kamis','Easy 4 km @ 5:50–6:30','05.30'];plans['2026-09-05']=['Sabtu','Long 7 km @ 6:00–6:30','05.00'];plans['2026-09-06']=['Minggu','Recovery 4 km @ 6:20–6:50','05.45'];plans['2026-11-30']=['Senin','TES 12 MENIT — TARGET 3,2 KM','05.30'];let selected='2026-09-01',done=JSON.parse(localStorage.binjasDone||'{}'),study=JSON.parse(localStorage.binjasStudy||'[]'),fit=JSON.parse(localStorage.binjasFit||'[]');function save(){localStorage.binjasDone=JSON.stringify(done);localStorage.binjasStudy=JSON.stringify(study);localStorage.binjasFit=JSON.stringify(fit)}function task(id,text){return `<label class="task"><input type="checkbox" data-id="${id}" ${done[id]?'checked':''}><span>${text}</span></label>`}function detail(k){let p=plans[k];return `<section class="card"><b>${p[0]} • ${k}</b><h2>🏃 ${p[1]}</h2><p>⏰ ${p[2]} WIB</p>${task(k,'Latihan hari ini selesai')}</section>`}function home(){return detail(selected)+`<section class="card"><h3>🎯 Target akhir</h3><p>3,2 km / 12 menit • Pull-up 21 • Push-up 45 • Sit-up 45</p></section>`}function cal(){let h='<section class="card"><h2>🗓️ Kalender</h2><div class="calendar">';Object.keys(dates).forEach(k=>{h+=`<div class="day ${k===selected?'sel ':''}${done[k]?'done':''}" data-day="${k}"><b>${k.slice(-2)}</b><br>${plans[k][1].split(' @')[0]}${done[k]?' ✓':''}</div>`});return h+'</div></section>'+detail(selected)}function week(){return Object.keys(plans).filter(k=>k>=selected).slice(0,7).map(k=>detail(k)).join('')}function studyView(){return `<section class="card"><h2>📚 Belajar 19.00–20.30</h2><input id="sub" placeholder="Mata pelajaran"><input id="mat" placeholder="Materi"><input id="hrs" type="number" step="0.5" placeholder="Jam"><textarea id="sum" placeholder="Kesimpulan materi"></textarea><textarea id="weak" placeholder="Materi belum dikuasai"></textarea><button class="primary" id="saveStudy">Simpan</button><p>Total hari: ${new Set(study.map(x=>x.d)).size} • Total jam: ${study.reduce((a,x)=>a+x.h,0).toFixed(1)}</p></section>`}function fitView(){return `<section class="card"><h2>📈 Progress</h2><input id="pull" type="number" placeholder="Pull-up"><input id="push" type="number" placeholder="Push-up"><input id="sit" type="number" placeholder="Sit-up"><button class="primary" id="saveFit">Simpan hasil</button></section>`}function pray(){return `<section class="card"><h2>🕌 Sholat 5 Waktu</h2>${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(x=>task('p'+x,x)).join('')}</section>`}function render(v){document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));view.innerHTML=v==='home'?home():v==='cal'?cal():v==='week'?week():v==='study'?studyView():v==='fit'?fitView():pray()}tabs.onclick=e=>{let b=e.target.closest('[data-v]');if(b)render(b.dataset.v)};view.onclick=e=>{let d=e.target.closest('[data-day]');if(d){selected=d.dataset.day;render('cal')}if(e.target.id==='saveStudy'){study.push({d:new Date().toISOString().slice(0,10),h:+hrs.value||0});save();render('study')}if(e.target.id==='saveFit'){fit.push({d:new Date().toISOString().slice(0,10),p:+pull.value||0,u:+push.value||0,s:+sit.value||0});save();render('fit')}};view.onchange=e=>{if(e.target.dataset.id){done[e.target.dataset.id]=e.target.checked;save()}};render('home');</script>
