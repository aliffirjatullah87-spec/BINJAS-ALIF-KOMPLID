let selected='2026-09-01',done=JSON.parse(localStorage.binjasDone||'{}'),study=JSON.parse(localStorage.binjasStudy||'[]'),fit=JSON.parse(localStorage.binjasFit||'[]'),pray=JSON.parse(localStorage.binjasPray||'{}');const view=document.getElementById('view');function save(){localStorage.binjasDone=JSON.stringify(done);localStorage.binjasStudy=JSON.stringify(study);localStorage.binjasFit=JSON.stringify(fit);localStorage.binjasPray=JSON.stringify(pray)}function task(id,text){return `<label class="task"><input type="checkbox" data-id="${id}" ${done[id]?'checked':''}><span>${text}</span></label>`}function detail(k){let p=run.find(x=>x.d===k),s=sm[k];return `<section class="card"><b>${p.day} • ${k}</b><h2 class="run">🏃 ${p.run}</h2><p>⏰ ${p.time} WIB</p>${s?`<div class="strength"><b>💪 Strength ${s.type}</b><br>${s.text}</div>`:''}${task(k,'Selesai latihan hari ini')}</section>`}function home(){return detail(selected)+`<section class="card"><h3>📌 Aturan program</h3><p>Tempo/interval: pemanasan 10–15 menit (jogging ringan + dynamic warm-up), sesi utama, cooldown 5–10 menit. Tempo seperti 3×1 km: recovery 2–3 menit jalan/jogging ringan.</p><p>Strength dilakukan setelah lari pada hari yang punya strength. Jangan sampai failure; submaksimal berarti masih sanggup sekitar 2 repetisi lagi. Sesi 1 menit: istirahat 2–4 menit antars et.</p></section>`}function cal(){let h='<section class="card"><h2>🗓️ Kalender 3 Bulan</h2><div class="calendar">';run.forEach(p=>{h+=`<div class="day ${p.d===selected?'sel ':''}${done[p.d]?'done':''}" data-day="${p.d}"><b>${p.d.slice(8)}</b><br>${p.run.split(' @')[0]}${sm[p.d]?'<br>💪 '+sm[p.d].type:''}${done[p.d]?' ✓':''}</div>`});return h+'</div></section>'+detail(selected)}function week(){let i=run.findIndex(x=>x.d===selected);if(i<0)i=0;return `<section class="card"><h2>📅 Mingguan</h2><p class="muted">Minggu mulai ${run[i].d}</p></section>`+run.slice(i,i+7).map(p=>detail(p.d)).join('')}function studyView(){return `<section class="card"><h2>📚 Belajar 19.00–20.30</h2><input id="sub" placeholder="Mata pelajaran"><input id="mat" placeholder="Materi"><input id="hrs" type="number" step="0.5" placeholder="Jam belajar"><textarea id="sum" placeholder="Kesimpulan materi setelah belajar"></textarea><textarea id="weak" placeholder="Materi yang belum dikuasai"></textarea><button class="primary" id="saveStudy">Simpan materi</button><p>Total hari belajar: ${new Set(study.map(x=>x.d)).size}<br>Total jam belajar: ${study.reduce((a,x)=>a+x.h,0).toFixed(1)} jam</p></section>`+study.slice().reverse().map(x=>`<section class="card"><b>${x.sub||'Materi'} — ${x.mat||''}</b><p>${x.h} jam</p><p>Kesimpulan: ${x.sum||'-'}</p><p class="muted">Belum dikuasai: ${x.weak||'-'}</p></section>`).join('')}function fitView(){return `<section class="card"><h2>📈 Progress Tes</h2><p>Target akhir: 3,2 km/12 menit • Pull-up 21 • Push-up 45 • Sit-up 45</p><input id="pull" type="number" placeholder="Pull-up / 1 menit"><input id="push" type="number" placeholder="Push-up / 1 menit"><input id="sit" type="number" placeholder="Sit-up / 1 menit"><button class="primary" id="saveFit">Simpan hasil</button></section>`+fit.slice().reverse().map(x=>`<section class="card">${x.d}<br>Pull-up: ${x.p} • Push-up: ${x.u} • Sit-up: ${x.s}</section>`).join('')}function prayView(){return `<section class="card"><h2>🕌 Sholat 5 Waktu</h2>${['Subuh','Dzuhur','Ashar','Maghrib','Isya'].map(x=>task('pray-'+x,x)).join('')}</section>`}function render(v){document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));view.innerHTML=v==='home'?home():v==='cal'?cal():v==='week'?week():v==='study'?studyView():v==='fit'?fitView():prayView()}document.getElementById('tabs').addEventListener('click',e=>{let b=e.target.closest('[data-v]');if(b)render(b.dataset.v)});view.addEventListener('click',e=>{let d=e.target.closest('[data-day]');if(d){selected=d.dataset.day;render('cal')}if(e.target.id==='saveStudy'){study.push({d:new Date().toISOString().slice(0,10),sub:document.getElementById('sub').value,mat:document.getElementById('mat').value,h:+document.getElementById('hrs').value||0,sum:document.getElementById('sum').value,weak:document.getElementById('weak').value});save();render('study')}if(e.target.id==='saveFit'){fit.push({d:new Date().toISOString().slice(0,10),p:+document.getElementById('pull').value||0,u:+document.getElementById('push').value||0,s:+document.getElementById('sit').value||0});save();render('fit')}});view.addEventListener('change',e=>{if(e.target.dataset.id){done[e.target.dataset.id]=e.target.checked;save();if(e.target.dataset.id.startsWith('pray-'))pray[e.target.dataset.id]=e.target.checked;render(document.querySelector('.tabs .on')?.dataset.v||'home')}});render('home');</script>
